name: Deploy pages

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

# only one deployment at a time; don't cancel one that is already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # The theme is a git submodule with an SSH URL (.gitmodules); the runner has no SSH key,
      # so fetch it over HTTPS instead (the theme repo is public).
      - name: Check out theme submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      # slidev's CLI runs under Node (>= 20.12)
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # The project is locked with bun (bun.lock); there is no package-lock.json for npm.
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # playwright-chromium is only needed for PDF export, not for the web build
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build
        run: bun run build --base /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
